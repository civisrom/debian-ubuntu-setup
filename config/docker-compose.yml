services:
  hbbs:
    container_name: hbbs
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00}
    command: hbbs -k _
    volumes:
      - ./data:/root
    network_mode: "host"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - hbbr
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hbbr:
    container_name: hbbr
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00}
    command: hbbr -k _
    volumes:
      - ./data:/root
    network_mode: "host"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
